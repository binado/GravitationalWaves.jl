name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      julia: ${{ steps.select.outputs.julia }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI selection and status handling
        run: python3 -m unittest discover -s .github/ci -v
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: paths
        with:
          list-files: json
          filters: |
            all:
              - '**'
      - name: Select packages and Julia versions
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.paths.outputs.all_files }}
          PR_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files || 0 }}
        run: python3 .github/ci/ci.py select

  test:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    name: ${{ matrix.package }} - Julia ${{ matrix.julia }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        julia: ${{ fromJSON(needs.changes.outputs.julia) }}
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: matrix.package != 'GWDistributions' && matrix.package != 'AbstractWaveforms' && matrix.package != 'GWNoise' && matrix.package != 'GWSeries' && matrix.package != 'AbstractWaveformsTests'
      - name: Set up Python reference environment
        if: matrix.package != 'GWDistributions' && matrix.package != 'AbstractWaveforms' && matrix.package != 'GWNoise' && matrix.package != 'GWSeries' && matrix.package != 'AbstractWaveformsTests' && matrix.package != 'SurrogateWaveforms'
        run: uv sync --project python --locked
      - name: Generate bilby reference fixtures
        if: matrix.package == 'LALWaveforms' || matrix.package == 'GWParameterConversion'
        run: uv run --project python python python/generate.py
      - name: Generate detector reference fixtures
        if: matrix.package == 'GWDetectors'
        run: uv run --project python python python/generate_detectors.py
      - name: Generate inference reference fixtures
        if: matrix.package == 'GWMatchedFiltering'
        run: uv run --project python python python/generate_inference.py
      - uses: actions/cache@v4
        if: matrix.package == 'SurrogateWaveforms'
        with:
          path: ${{ runner.temp }}/surrogate-data
          key: surrogate-data-v1
      - name: Generate surrogate reference fixtures
        if: matrix.package == 'SurrogateWaveforms'
        run: |
          uv sync --project python/surrogates --locked
          uv run --project python/surrogates python python/generate_surrogates.py --data-dir "$RUNNER_TEMP/surrogate-data" --download
          echo "GWSURROGATES_DATA_DIR=$RUNNER_TEMP/surrogate-data" >> "$GITHUB_ENV"
      - name: Locate LAL libraries
        if: matrix.package == 'LALWaveforms' || matrix.package == 'FrequencyDomainWaveforms'
        run: echo "LALWAVEFORMS_LIBDIR=$(uv run --project python python python/libdir.py)" >> $GITHUB_ENV
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: packages/${{ matrix.package }}
          coverage: 'false'

  surrogate-oracle:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.packages), 'SurrogateWaveforms')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/surrogate-data
          key: surrogate-data-v1
      - name: Set up pinned oracle and model data
        run: |
          uv sync --project python/surrogates --locked
          echo "PYTHON=$(uv run --project python/surrogates python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "GWSURROGATES_DATA_DIR=$RUNNER_TEMP/surrogate-data" >> "$GITHUB_ENV"
      - name: Compare public surrogate outputs
        run: |
          julia --project=test/waveforms/surrogate_oracle -e 'using Pkg; Pkg.instantiate(); Pkg.build("PyCall")'
          julia --check-bounds=yes --project=test/waveforms/surrogate_oracle test/waveforms/surrogate_oracle/runtests.jl

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'

  status:
    name: CI passed
    if: always()
    needs: [changes, test, surrogate-oracle, format]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/ci/ci.py check
