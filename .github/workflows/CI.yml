name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.julia }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        julia: ["1.12", "1"]
        package: [LALWaveforms, GWParameterConversion, GWWaveforms, GWDistributions]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: matrix.package != 'GWDistributions'
      - name: Set up waveform reference environment
        if: matrix.package != 'GWDistributions'
        run: uv sync --project python --locked
      - name: Generate bilby reference fixtures
        if: matrix.package == 'LALWaveforms' || matrix.package == 'GWParameterConversion'
        run: uv run --project python python python/generate.py
      - name: Locate LAL libraries
        if: matrix.package == 'LALWaveforms' || matrix.package == 'GWWaveforms'
        run: echo "LALWAVEFORMS_LIBDIR=$(uv run --project python python python/libdir.py)" >> $GITHUB_ENV
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: packages/${{ matrix.package }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
