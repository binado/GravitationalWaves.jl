name: Runic

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  runic:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
