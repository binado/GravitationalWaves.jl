[project]
name = "gw-fixtures"
version = "0.0.0"
description = "Tools for generating gravitational-wave reference fixtures and integration data"
requires-python = ">=3.10,<3.14"
dependencies = ["bilby", "lalsuite", "numpy"]

[project.scripts]
find-lalsimulation-header-files = "gw_fixtures.cli.find_lalsimulation_header_files:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
